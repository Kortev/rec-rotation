<template id="plan-extra">
  <section class="panel">
    <h2>How much each muscle gets</h2>
    <p class="small muted">Hard sets per week if you get all 4 workouts in. Research puts the efficient range around 6–12 sets per muscle per week. About 4 is the least that still produces growth you can measure.<sup><a class="cite" href="#src-pelland"></a></sup> At 3 workouts a week you get about three-quarters of this, which still works.</p>

      <thead><tr><th>Muscle</th><th class="num">Sets / week</th><th>Why it's in the plan</th></tr></thead>
      <tbody>
        <tr><td>Side delts</td><td class="num mono">10</td><td>Wider shoulders, the top priority for your goal</td></tr>
        <tr><td>Quads</td><td class="num mono">8</td><td>Your biggest muscles</td></tr>
        <tr><td>Hamstrings</td><td class="num mono">8</td><td>Balance for the quads</td></tr>
        <tr><td>Chest</td><td class="num mono">6</td><td>Upper-body size</td></tr>
        <tr><td>Back</td><td class="num mono">6</td><td>Upper-body width and thickness</td></tr>
        <tr><td>Biceps, triceps</td><td class="num mono">2 + more</td><td>They also work in every press and pull</td></tr>
      </tbody>
    </table></div>
  </section>
  <section class="panel">
    <h2>What you'll see, and when</h2>
    <div class="wk">
      <div class="wk-row"><span class="t">1–3</span><span>Your weights climb fast. That's mostly your brain learning the moves. Any extra size this early is mostly swelling, not muscle.<sup><a class="cite" href="#src-damas"></a></sup></span><span class="d">weeks</span></div>
      <div class="wk-row"><span class="t">3–8</span><span>Real muscle growth starts. A tape measure catches it before the mirror does.<sup><a class="cite" href="#src-damas"></a></sup></span><span class="d">weeks</span></div>
      <div class="wk-row"><span class="t">8–12</span><span>Trained muscles are typically 5–10% bigger. The average beginner adds about 1.5 kg (3.3 lb) of lean mass in the first 10 weeks.<sup><a class="cite" href="#src-benito"></a></sup></span><span class="d">weeks</span></div>
      <div class="wk-row"><span class="t">4–8</span><span>Your haircut grows back. Hair grows about 1 cm (under half an inch) a month.<sup><a class="cite" href="#src-hair"></a></sup></span><span class="d">weeks</span></div>
    </div>
  </section>
  <section class="panel">
    <h2>Food and sleep</h2>
    <ul class="rules">
      <li><b>Don't diet.</b> Eat about what you burn, or a little more. In a meta-analysis, a deficit of about 500 calories a day stopped lean-mass gains.<sup><a class="cite" href="#src-murphy"></a></sup> Lifting alone, with no diet change, lowered body fat by about 1.5 percentage points on average.<sup><a class="cite" href="#src-wewege"></a></sup></li>
      <li><b>If you'd rather gain a little,</b> aim for 0.25–0.5% of your bodyweight a week. At 150 lb that's about ½ lb a week. Faster than that is mostly fat.<sup><a class="cite" href="#src-iraki"></a></sup></li>
      <li><b>Protein: 0.7–1 g per pound of bodyweight a day.</b> At 150 lb that's 105–150 g. In the biggest analysis, muscle gains stopped improving around 0.7 g/lb, and 1 g/lb covers the uncertainty.<sup><a class="cite" href="#src-morton"></a></sup> When you eat it barely matters. The daily total is what counts, and the Protein tab keeps count for you.</li>
      <li><b>Sleep 7–9 hours.</b> When people dieted on 5½ hours of sleep, more of the weight they lost came from muscle and less from fat.<sup><a class="cite" href="#src-nedeltcheva"></a></sup></li>
      <li><b>Creatine (optional).</b> 3–5 g of creatine monohydrate a day, any time. With lifting it adds about 1 kg of lean mass on average, and part of that is water.<sup><a class="cite" href="#src-delpino"></a></sup> It's one of the most studied supplements and is considered safe for healthy people. The hair-loss claim didn't hold up in a trial that actually measured hair.<sup><a class="cite" href="#src-kreider"></a></sup> Skip it if you have kidney problems.</li>
    </ul>
  </section>

<template id="checkin-help">

<template id="why-src">
  <section class="panel prose">
    <h2>The short version</h2>
    <p>You can't burn fat off your face specifically, and at 14% there may not be much to lose. A diet would mostly cost you the muscle you're trying to build. What changes how you look is <b>more muscle, especially wider shoulders</b>, plus the haircut growing out. That's what this plan is built around. Sessions stay short because short, focused workouts build muscle nearly as well as long ones.</p>
  </section>

  <section class="panel prose">
    <div class="row"><h2>Your face</h2><span class="verdict yes">Well supported</span></div>
    <p><b>Face fat follows total body fat.</b> Across studies, how fat a face looks lines up closely with BMI and body fat (correlation 0.71).<sup><a class="cite" href="#src-dejager"></a></sup> Training a body part doesn't burn the fat on it. In one 12-week trial, training only one leg took fat off the arms and trunk, not off that leg.<sup><a class="cite" href="#src-ramirez"></a></sup></p>
    <p><b>It takes a lot of weight change before a face looks different.</b> People only noticed a change in someone's face after about 1.3 BMI points, which is roughly 8–9 lb for an average-height guy.<sup><a class="cite" href="#src-rerule"></a></sup> If you're really at 14%, losing that much means dieting, and dieting stalls muscle gain.<sup><a class="cite" href="#src-murphy"></a></sup></p>
    <p><b>Your 14% may not be accurate.</b> Bathroom scales and handheld body-fat devices can be off by up to about 10 points for one person. In a 2025 test against a lab scan, even the best of six devices had that kind of spread.<sup><a class="cite" href="#src-irwin"></a></sup> Your real number could be anywhere from high single digits to around 20%. That's why the Progress tab tracks your waist, measurements and lifts instead.</p>
  </section>

  <section class="panel prose">
    <div class="row"><h2>Your roommate's tip: neck and traps</h2><span class="verdict part">Not proven</span></div>
    <p><b>Neck training does grow neck muscle.</b> Students who added weighted neck work for 12 weeks grew their neck muscles about 13% on MRI. Regular lifting with squats, deadlifts and rows didn't grow the neck at all.<sup><a class="cite" href="#src-conley"></a></sup> But the outside measurement barely moves. One study found about a third of a centimeter after 7 weeks.<sup><a class="cite" href="#src-rotto"></a></sup></p>
    <p><b>No study has tested whether a bigger neck or traps makes a face look leaner.</b> It's a guess based on proportions. One visual-illusion demo points the other way: a wider neck and jaw made the whole head look wider.<sup><a class="cite" href="#src-morikawa"></a></sup> The evidence that shrugs grow the traps is thin too.</p>
    <p><b>What is supported is shoulder width.</b> Broader shoulders compared with hips were rated more attractive,<sup><a class="cite" href="#src-pazhoohi"></a></sup> and how strong a man's upper body looked explained most of how attractive his body was rated.<sup><a class="cite" href="#src-sell"></a></sup> So this plan puts its extra sets into lateral raises (10 a week) and keeps shrugs as a bonus.</p>
    <p class="small muted">If you want to try neck work anyway: 1 set of neck curls and 1 set of neck extensions, twice a week, 15–25 reps with a very light plate, adding reps before weight. That's coaching advice, not a tested protocol. Stop if anything pinches or tingles.</p>
  </section>

  <section class="panel prose">
    <div class="row"><h2>Face yoga, jawline trainers, gum</h2><span class="verdict">Skip them</span></div>
    <p>The best-known face-exercise study found the cheeks got <i>fuller</i>, not slimmer, and it had 16 finishers and no comparison group.<sup><a class="cite" href="#src-alam"></a></sup> A 6-month gum-chewing trial didn't change jaw-muscle size or jaw shape.<sup><a class="cite" href="#src-jung"></a></sup> If a jaw trainer did grow your jaw muscle, it would make your lower face <i>wider</i>. Doctors shrink that same muscle with Botox to narrow the jaw.</p>
  </section>

  <section class="panel prose">
    <div class="row"><h2>The haircut</h2><span class="verdict">Barber rule of thumb</span></div>
    <p>Almost no research tests how hairstyles change face shape. The only study found was a 1998 paper using one face: longer hair with bangs made it look rounder, and a shorter cut looked slimmer.<sup><a class="cite" href="#src-korean"></a></sup> The usual barber advice for a fuller face is <b>more height on top and tighter sides</b>, which makes the face look longer. Treat that as a rule of thumb, not science. Hair grows about 1 cm a month, so you'll have options again soon.<sup><a class="cite" href="#src-hair"></a></sup></p>
  </section>

  <section class="panel prose">
    <div class="row"><h2>Puffy days</h2><span class="verdict">Mixed evidence</span></div>
    <p>Faces do look different from day to day, but the research is weak. In one study, people kept awake for 31 hours had more swollen-looking eyes,<sup><a class="cite" href="#src-sundelin"></a></sup> but a larger study of one sleepless night found no difference.<sup><a class="cite" href="#src-holding"></a></sup> No study has measured salt and face puffiness. Lying down shifts a little fluid into your face, so don't judge your face right after you wake up.</p>
  </section>

  <section class="panel prose">
    <div class="row"><h2>Why short workouts work</h2><span class="verdict yes">Well supported</span></div>
    <ul class="rules">
      <li><b>More sets help, with steep diminishing returns.</b> Around 4 hard sets per muscle per week already produces growth you can measure. Beyond about 10, each extra gain costs a lot more gym time.<sup><a class="cite" href="#src-pelland"></a>,<a class="cite" href="#src-schoenfeld17"></a></sup> Five or six exercises is enough. Eight or nine is where people start skipping.</li>
      <li><b>Paired sets save about 40% of the time.</b> Alternating two moves that use opposite muscles, like a chest press and a pulldown, did the same work in much less time: 24 minutes instead of 42 in one study.<sup><a class="cite" href="#src-zhang"></a>,<a class="cite" href="#src-weakley"></a></sup> They feel harder, which is the trade-off.</li>
      <li><b>60–90 seconds of rest is enough.</b> Resting longer than about 90 seconds showed no clear extra benefit.<sup><a class="cite" href="#src-singer"></a></sup> With paired sets, each muscle rests longer than the clock shows.</li>
      <li><b>Machines build muscle as well as free weights.</b><sup><a class="cite" href="#src-haugen"></a></sup> They're easier to learn, and your rec has plenty of them.</li>
      <li><b>You don't need to go to failure.</b> Stopping a rep or two short grew muscle about as well as going all the way.<sup><a class="cite" href="#src-refalo"></a></sup></li>
      <li><b>The 4-day split isn't magic.</b> With the same weekly sets, training a muscle twice a week grew it about as much as once.<sup><a class="cite" href="#src-schoenfeld19"></a></sup> The split exists so no single session gets long.</li>
      <li><b>Heavy work first, easy work last.</b> Beginners who did their hardest lifting first remembered the session as more pleasant.<sup><a class="cite" href="#src-hutchinson"></a></sup> How a workout feels predicts whether people come back, and lack of time is students' top reason for not exercising.<sup><a class="cite" href="#src-silva"></a></sup></li>
    </ul>
  </section>

  <section class="panel prose">
    <div class="row"><h2>Why the app works this way</h2><span class="verdict yes">Supported</span></div>
    <p><b>Tracking plus a goal plus feedback.</b> Across 122 studies, programs that paired self-tracking with goals and feedback on progress worked better than ones that didn't (effect size 0.42 vs 0.26).<sup><a class="cite" href="#src-michie"></a></sup> In 138 studies, checking progress toward a goal helped people reach it.<sup><a class="cite" href="#src-harkin"></a></sup> That's why the app shows your week count against 4 workouts and your new bests when you finish.</p>
    <p><b>One tap to log, rest timer starts by itself.</b> This is how the main lifting apps work (Hevy, Strong and others): your last numbers are filled in and a set is one tap.</p>
  </section>

  <section class="panel">
    <h3>Where the numbers come from</h3>
    <p class="small muted">Quick-add amounts are from USDA FoodData Central, rounded, or from the brand's label for shakes, whey and jerky. Foods that vary a lot by brand (tofu, jerky, deli turkey, whey) use a typical label value, so check yours. The goal of 0.7–1 g per pound comes from a review of 49 trials in which muscle gains stopped improving around 0.7 g/lb.<sup><a class="cite" href="#src-morton"></a></sup></p>
    <p class="small muted">Scanned products come from <a href="https://world.openfoodfacts.org" target="_blank" rel="noopener">Open Food Facts</a>, a free volunteer food database (data under the Open Database License). Some entries are missing or wrong. When that happens, type the label's number once and the app remembers it.</p>
